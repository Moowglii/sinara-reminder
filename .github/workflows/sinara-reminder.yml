name: Sinara reports reminder

on:
  schedule:
    # 11:00 MSK = 08:00 UTC (GitHub cron в UTC)
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Send reminder
        env:
          PACHCA_TOKEN: ${{ secrets.PACHCA_TOKEN }}
          ENTITY_ID: "14904221"
        run: |
          set -euo pipefail

          MSG="@Поддержка ТЕСТ: webhook Sinara работает"

          # Попробуем сначала как chat, потом как channel (чтобы сразу понять что принимает API)
          for ENTITY_TYPE in chat channel; do
            echo "=== TRY entity_type=$ENTITY_TYPE entity_id=$ENTITY_ID ==="

            PAYLOAD="$(jq -nc \
              --arg entity_type "$ENTITY_TYPE" \
              --argjson entity_id "$ENTITY_ID" \
              --arg content "$MSG" \
              '{entity_type:$entity_type, entity_id:$entity_id, content:$content}')"

            echo "Отправляем payload: $PAYLOAD"

            RESP="$(curl -sS -X POST "https://api.pachca.com/api/shared/v1/messages" \
              -H "Authorization: Bearer $PACHCA_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              --data-binary "$PAYLOAD" \
              -w "\nHTTP_STATUS:%{http_code}\n")"

            echo "$RESP"
          done
