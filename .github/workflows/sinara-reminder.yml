name: Sinara reports reminder

on:
  schedule:
    # 11:00 MSK = 08:00 UTC
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Send test message regardless of day"
        required: false
        default: "false"
      chat_id:
        description: "Pachca discussion(chat) id"
        required: false
        default: "39076053"

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder to Pachca
        env:
          PACHCA_TOKEN: ${{ secrets.PACHCA_TOKEN }}
          CHAT_ID: ${{ github.event.inputs.chat_id || '39076053' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail

          DOW=$(TZ=Europe/Moscow date +%u) # 1=Mon ... 7=Sun

          if [ "${FORCE}" = "true" ]; then
            TEXT="@Поддержка ТЕСТ: webhook Sinara работает ✅"
          else
            case "$DOW" in
              1) TEXT="@Поддержка Напоминание: опубликовать отчёты Банка Синара за ЧТ и ПТ прошлой недели." ;;
              4) TEXT="@Поддержка Напоминание: опубликовать отчёт Банка Синара за ПН." ;;
              5) TEXT="@Поддержка Напоминание: опубликовать отчёты Банка Синара за ВТ и СР." ;;
              *) echo "Сегодня не день отправки (DOW=$DOW). Выход."; exit 0 ;;
            esac
          fi

          echo "Sending to discussion(chat) id=${CHAT_ID}"
          echo "Text: ${TEXT}"

          curl --fail-with-body -sS -X POST "https://api.pachca.com/api/shared/v1/messages" \
            -H "Authorization: Bearer ${PACHCA_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-raw "{\"message\":{\"entity_type\":\"discussion\",\"entity_id\":${CHAT_ID},\"content\":\"${TEXT}\"}}"
