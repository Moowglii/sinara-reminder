name: Sinara reports reminder

on:
  schedule:
    # GitHub cron is UTC. 11:00 MSK = 08:00 UTC
    - cron: "0 8 * * 1"  # Monday
    - cron: "0 8 * * 4"  # Thursday
    - cron: "0 8 * * 5"  # Friday
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder
        env:
          PACHCA_TOKEN: ${{ secrets.PACHCA_TOKEN }}
          CHAT_ID: "33740223"
        run: |
          set -euo pipefail

          DOW=$(TZ=Europe/Moscow date +%u) # 1=Mon ... 7=Sun

          if [ "$DOW" = "1" ]; then
            MSG="@Поддержка Напоминание: опубликовать отчёты Банка Синара за ЧТ и ПТ прошлой недели."
          elif [ "$DOW" = "4" ]; then
            MSG="@Поддержка Напоминание: опубликовать отчёт Банка Синара за ПН."
          elif [ "$DOW" = "5" ]; then
            MSG="@Поддержка Напоминание: опубликовать отчёты Банка Синара за ВТ и СР."
          else
            echo "No reminder for this day"
            exit 0
          fi

          # ВАЖНО: API ждёт обёртку "message"
          payload=$(cat <<JSON
          {
            "message": {
              "entity_type": "discussion",
              "entity_id": ${CHAT_ID},
              "content": "${MSG}"
            }
          }
          JSON
          )

          echo "Sending payload: $payload"

          curl --fail-with-body -sS -X POST "https://api.pachca.com/api/shared/v1/messages" \
            -H "Authorization: Bearer ${PACHCA_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload"
