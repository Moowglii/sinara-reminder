name: Sinara reports reminder

on:
  schedule:
    # GitHub cron is in UTC
    # 11:00 MSK = 08:00 UTC
    - cron: "0 8 * * 1"   # Monday 11:00 MSK
    - cron: "0 8 * * 4"   # Thursday 11:00 MSK
    - cron: "0 8 * * 5"   # Friday 11:00 MSK
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
      - name: Send reminder
        env:
          PACHCA_TOKEN: ${{ secrets.PACHCA_TOKEN }}
        run: |
          set -euo pipefail

          # ===== 1) Decide message =====
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            MSG="@Поддержка ТЕСТ: webhook Sinara работает"
          else
            DOW=$(TZ=Europe/Moscow date +%u)  # 1=Mon ... 7=Sun

            if [ "$DOW" = "1" ]; then
              MSG="@Поддержка Напоминание: опубликовать отчёты Банка Синара за ЧТ и ПТ прошлой недели."
            elif [ "$DOW" = "4" ]; then
              MSG="@Поддержка Напоминание: опубликовать отчёт Банка Синара за ПН."
            elif [ "$DOW" = "5" ]; then
              MSG="@Поддержка Напоминание: опубликовать отчёты Банка Синара за ВТ и СР."
            else
              echo "No reminder for this day (DOW=$DOW)."
              exit 0
            fi
          fi

          # ===== 2) Send message to Pachca =====
          # IMPORTANT: put YOUR chat/channel ID here
          ENTITY_TYPE="chat"
          ENTITY_ID="33740223"

          payload=$(printf '{"entity_type":"%s","entity_id":%s,"content":"%s"}' \
            "$ENTITY_TYPE" "$ENTITY_ID" "$(printf '%s' "$MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read())[1:-1])')")

          echo "Sending payload: $payload"

          curl --fail-with-body -sS -X POST "https://api.pachca.com/api/shared/v1/messages" \
            -H "Authorization: Bearer $PACHCA_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload"
