name: Sinara reports reminder

on:
  schedule:
    # 11:00 MSK = 08:00 UTC
    - cron: "0 8 * * 1"
    - cron: "0 8 * * 4"
    - cron: "0 8 * * 5"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder
        env:
          PACHCA_TOKEN: ${{ secrets.PACHCA_TOKEN }}
        run: |
          set -euo pipefail

          CHAT_ID="33740223"
          DOW="$(TZ=Europe/Moscow date +%u)"  # 1=Mon ... 7=Sun

          if [ "$DOW" = "1" ]; then
            MSG="@Поддержка Напоминание: опубликовать отчёты Банка Синара за ЧТ и ПТ прошлой недели."
          elif [ "$DOW" = "4" ]; then
            MSG="@Поддержка Напоминание: опубликовать отчёт Банка Синара за ПН."
          elif [ "$DOW" = "5" ]; then
            MSG="@Поддержка Напоминание: опубликовать отчёты Банка Синара за ВТ и СР."
          else
            exit 0
          fi

          # Сбор JSON без ручного экранирования
          PAYLOAD="$(jq -nc \
            --arg entity_type "channel" \
            --argjson entity_id "$CHAT_ID" \
            --arg content "$MSG" \
            '{entity_type:$entity_type, entity_id:$entity_id, content:$content}')"

          echo "Отправляем payload: $PAYLOAD"

          curl --fail-with-body -sS -X POST "https://api.pachca.com/api/shared/v1/messages" \
            -H "Authorization: Bearer $PACHCA_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary "$PAYLOAD"
          curl --fail-with-body -sS -X POST "https://api.pachca.com/api/shared/v1/messages" \
            -H "Authorization: Bearer $PACHCA_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$PAYLOAD"
