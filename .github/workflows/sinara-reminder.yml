name: Sinara reports reminder

on:
  schedule:
    - cron: "0 8 * * 1"  # Понедельник 11:00 МСК
    - cron: "0 8 * * 4"  # Четверг 11:00 МСК
    - cron: "0 8 * * 5"  # Пятница 11:00 МСК
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminder
        run: |
          DOW=$(date -u +%u) # 1=Mon ... 7=Sun

          if [ "$DOW" = "1" ]; then
            MSG='тест'
          elif [ "$DOW" = "4" ]; then
            MSG='тест'
          elif [ "$DOW" = "5" ]; then
            MSG='тест'
          else
            exit 0
          fi

          curl --fail-with-body -sS -X POST "https://api.pachca.com/webhooks/01KJ7DXKMBGYJQZ3C530QQ61Y2" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"$MSG\"}"
